<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cart · PokeEngrave</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">PokeEngrave</a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="custom.html">Custom Designs</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html" aria-current="page">Cart (<span data-cart-count>0</span>)</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <h1 class="page-title">Cart</h1>

    <p id="empty" class="empty" hidden>Your cart is empty. <a href="index.html">Browse designs</a></p>

    <div id="orderPlaced" class="auth-panel order-placed" hidden>
      <p><strong>Thank you! Your order has been placed.</strong></p>
      <p>Order number <strong id="orderNumber"></strong>. We'll be in touch to arrange payment and delivery.</p>
      <div class="auth-actions">
        <a class="btn btn-outline" href="login.html">View your orders</a>
        <a class="btn btn-outline" href="index.html">Continue shopping</a>
      </div>
    </div>

    <div id="cart" class="cart" hidden>
      <div id="lines" class="cart-lines"></div>
      <aside class="summary">
        <div class="summary-row"><span>Items</span><span id="items"></span></div>
        <div class="summary-row"><span>Shipping</span><span class="muted">Calculated at checkout</span></div>
        <div class="summary-row total"><span>Subtotal</span><span id="subtotal"></span></div>
        <button id="checkout" class="btn btn-block" type="button">Checkout</button>
        <p id="checkoutNote" class="note" hidden></p>
      </aside>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">© PokeEngrave</div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/binder.js"></script>
  <script src="js/common.js"></script>
  <script src="js/cart.js"></script>
</body>

</html>
