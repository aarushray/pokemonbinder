<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Orders · TCGEngrave</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-no-pages>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">TCGEngrave</a>
      <nav class="nav">
        <a href="index.html">Shop</a>
        <a href="admin.html">Manage designs</a>
        <a href="orders.html" data-right aria-current="page">Orders</a>
        <a href="messages.html" data-right>Messages</a>
        <a href="#" data-right data-logout>Log out</a>
      </nav>
    </div>
  </header>

  <main class="container admin-gate">
    <div class="intro">
      <h1>Orders</h1>
      <p>Every order, newest first. Change an order's status as it moves along, and download customers' artwork for custom designs.</p>
    </div>


    <div class="section-head orders-head">
      <select id="statusFilter" class="sub-filter" aria-label="Filter by status">
        <option value="">All orders</option>
      </select>
      <span id="orderCount" class="muted"></span>
    </div>
    <div id="orders" class="admin-orders"></div>
    <p id="noOrders" class="empty" hidden>No orders yet.</p>
    <p id="orderStatus" class="status error" hidden></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/binder.js"></script>
  <script src="js/common.js"></script>
  <script src="js/admin-auth.js"></script>
  <script src="js/orders.js"></script>
</body>
</html>
