<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Design · TCGEngrave</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">TCGEngrave</a>
      <nav class="nav">
        <a href="index.html">Home</a>
        <a href="custom.html">Custom Designs</a>
        <a href="contact.html">Contact</a>
        <a href="cart.html">Cart (<span data-cart-count>0</span>)</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <a class="back" href="index.html">← All designs</a>

    <p id="missing" class="empty" hidden>This design couldn't be found. <a href="index.html">Back to all designs</a></p>

    <div id="product" class="product" hidden>
      <div class="stage">
        <canvas id="canvas" aria-label="Binder preview"></canvas>
      </div>

      <div class="product-info">
        <h1 id="name"></h1>
        <p id="typeName" class="label"></p>
        <p id="price" class="price"></p>

        <label id="finishField" class="field finish-field" hidden>
          <span>Texture</span>
          <select id="finish"></select>
        </label>
        <div id="finishFixed" class="field finish-field" hidden>
          <span>Texture</span>
          <div class="fixed-value">Diamond texture</div>
        </div>
        <p class="label">Binder colour: <strong id="colorName"></strong></p>
        <div id="swatches" class="swatches" role="radiogroup" aria-label="Binder colour"></div>

        <div class="buy-row">
          <div class="qty" aria-label="Quantity">
            <button id="minus" type="button" aria-label="Decrease quantity">−</button>
            <span id="qty">1</span>
            <button id="plus" type="button" aria-label="Increase quantity">+</button>
          </div>
          <button id="addBtn" class="btn" type="button">Add to cart</button>
        </div>
        <p id="added" class="note" hidden>Added to cart. <a href="cart.html">View cart</a></p>

        <div class="details">
          <ul>
            <li id="pockets"></li>
            <li id="cards"></li>
            <li>Laser engraved to order in small batches</li>
          </ul>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">© TCGEngrave</div>
  </footer>

  <script src="js/catalog.js"></script>
  <script src="js/binder.js"></script>
  <script src="js/common.js"></script>
  <script src="js/product.js"></script>
</body>

</html>
